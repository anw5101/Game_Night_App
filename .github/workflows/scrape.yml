name: Nightly Data Scraper

on:
  schedule:
    - cron: '0 8 * * *' # 8:00 AM UTC (approx 3/4 AM EST)
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4 requests playwright
        playwright install chromium

    - name: Run Scraper
      run: |
        python scraper/main.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add web/public/data/events.json
        # Only commit if there are changes
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated nightly data update" && git push)
