<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Finder</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Quest Finder</h1>
        <div class="header-controls">
            <span id="last-verified">Last Verified: Loading...</span>
        </div>
    </header>
    
    <main>
        <aside class="sidebar">
            <div class="control-group">
                <label for="radius-slider">Search Radius (miles): <span id="radius-value">10</span></label>
                <input type="range" id="radius-slider" min="1" max="50" value="10">
            </div>

            <div class="control-group">
                <h3>Game Types</h3>
                <label><input type="checkbox" class="game-filter" value="Trivia" checked> Trivia</label><br>
                <label><input type="checkbox" class="game-filter" value="Music Bingo" checked> Music Bingo</label><br>
                <label><input type="checkbox" class="game-filter" value="Karaoke" checked> Karaoke</label><br>
            </div>
        </aside>

        <div id="map"></div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/app.js"></script>
</body>
</html>
